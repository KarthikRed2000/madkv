syntax = "proto3";

package kvstore;

// KV Store service definition
service KVStore {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Swap(SwapRequest) returns (SwapResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Scan(ScanRequest) returns (ScanResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

// Put operation
message PutRequest {
  string key = 1;
  string value = 2;
}

message PutResponse {
  bool found = 1;  // true if key existed before
}

// Swap operation
message SwapRequest {
  string key = 1;
  string value = 2;
}

message SwapResponse {
  bool found = 1;       // true if key existed
  string old_value = 2; // previous value if found
}

// Get operation
message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;  // true if key exists
  string value = 2;
}

// Scan operation
message ScanRequest {
  string start_key = 1;
  string end_key = 2;  // inclusive
}

message KeyValuePair {
  string key = 1;
  string value = 2;
}

message ScanResponse {
  repeated KeyValuePair entries = 1;
}

// Delete operation
message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool found = 1;
}
